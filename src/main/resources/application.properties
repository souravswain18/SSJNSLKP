# ==============================================================================
# Sri Sri Jagannath Nam Sankirtan Lok Kalaparisad - Spring Boot Configuration
# ==============================================================================

server.port=${PORT:8080}
spring.application.name=sri-jagannath-sankirtan-parisad

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:jagannath_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Multipart File Upload Settings (Max 10MB per devotional photo)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Upload directories on disk
app.upload.dir=uploads/photos/
app.upload.doc.dir=uploads/documents/

# Disable static resource caching during development
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.cache.cachecontrol.max-age=0
