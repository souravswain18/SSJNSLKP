<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="100%" height="100%" opacity="0.15">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FF8C00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#800000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Glowing core -->
  <circle cx="720" cy="300" r="300" fill="url(#centerGlow)"/>

  <!-- Concentric sacred geometry -->
  <g stroke="#FFE082" fill="none" stroke-width="1.5" transform="translate(720, 300)">
    <circle r="60"/>
    <circle r="120" stroke-dasharray="8,6"/>
    <circle r="180"/>
    <circle r="240" stroke-dasharray="4,8"/>
    <circle r="300"/>
    
    <!-- 12 Petals -->
    <path d="M 0,-180 C 40,-120 40,-60 0,0 C -40,-60 -40,-120 0,-180 Z" fill="#FFE082" fill-opacity="0.04"/>
    <path d="M 0,-180 C 40,-120 40,-60 0,0 C -40,-60 -40,-120 0,-180 Z" fill="#FFE082" fill-opacity="0.04" transform="rotate(30)"/>
    <path d="M 0,-180 C 40,-120 40,-60 0,0 C -40,-60 -40,-120 0,-180 Z" fill="#FFE082" fill-opacity="0.04" transform="rotate(60)"/>
    <path d="M 0,-180 C 40,-120 40,-60 0,0 C -40,-60 -40,-120 0,-180 Z" fill="#FFE082" fill-opacity="0.04" transform="rotate(90)"/>
    <path d="M 0,-180 C 40,-120 40,-60 0,0 C -40,-60 -40,-120 0,-180 Z" fill="#FFE082" fill-opacity="0.04" transform="rotate(120)"/>
    <path d="M 0,-180 C 40,-120 40,-60 0,0 C -40,-60 -40,-120 0,-180 Z" fill="#FFE082" fill-opacity="0.04" transform="rotate(150)"/>
    <path d="M 0,-180 C 40,-120 40,-60 0,0 C -40,-60 -40,-120 0,-180 Z" fill="#FFE082" fill-opacity="0.04" transform="rotate(180)"/>
    <path d="M 0,-180 C 40,-120 40,-60 0,0 C -40,-60 -40,-120 0,-180 Z" fill="#FFE082" fill-opacity="0.04" transform="rotate(210)"/>
    <path d="M 0,-180 C 40,-120 40,-60 0,0 C -40,-60 -40,-120 0,-180 Z" fill="#FFE082" fill-opacity="0.04" transform="rotate(240)"/>
    <path d="M 0,-180 C 40,-120 40,-60 0,0 C -40,-60 -40,-120 0,-180 Z" fill="#FFE082" fill-opacity="0.04" transform="rotate(270)"/>
    <path d="M 0,-180 C 40,-120 40,-60 0,0 C -40,-60 -40,-120 0,-180 Z" fill="#FFE082" fill-opacity="0.04" transform="rotate(300)"/>
    <path d="M 0,-180 C 40,-120 40,-60 0,0 C -40,-60 -40,-120 0,-180 Z" fill="#FFE082" fill-opacity="0.04" transform="rotate(330)"/>
  </g>
</svg>
