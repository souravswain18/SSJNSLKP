<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#1C0A00"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF5C2"/>
      <stop offset="100%" stop-color="#E5A93C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="550" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="760" height="510" rx="14" fill="none" stroke="#FFCC80" stroke-width="2" opacity="0.4"/>
  <rect x="28" y="28" width="744" height="494" rx="10" fill="none" stroke="#FFCC80" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>

  <g fill="#FFCC80" opacity="0.6">
    <circle cx="36" cy="36" r="6"/>
    <circle cx="764" cy="36" r="6"/>
    <circle cx="36" cy="514" r="6"/>
    <circle cx="764" cy="514" r="6"/>
  </g>

  <circle cx="400" cy="270" r="160" fill="#FFCC80" opacity="0.08"/>
  <circle cx="400" cy="270" r="110" fill="#FFFFFF" opacity="0.05"/>

  <g transform="translate(45, 65)">
    <rect x="0" y="0" width="185" height="34" rx="17" fill="rgba(0,0,0,0.45)" stroke="#FFCC80" stroke-width="1.5"/>
    <text x="92" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#FFE082" text-anchor="middle">📍 Kalahandi, Odisha</text>

    <rect x="200" y="0" width="165" height="34" rx="17" fill="rgba(255,255,255,0.15)" stroke="#FFF" stroke-width="1"/>
    <text x="282" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Gramin Annadan Seva</text>
  </g>

  <g transform="translate(680, 65)">
    <rect x="0" y="0" width="75" height="34" rx="17" fill="rgba(0,0,0,0.5)" stroke="#FFCC80" stroke-width="1"/>
    <text x="37" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FFE082" text-anchor="middle">✨ 2025</text>
  </g>

  <!-- Annadan Bowl & Giving Hands -->
  <g transform="translate(400, 260) scale(1.15)">
    <ellipse cx="0" cy="20" rx="70" ry="25" fill="#FFE082" opacity="0.8"/>
    <path d="M -70,20 Q 0,80 70,20 Z" fill="#E5A93C" stroke="#FFF" stroke-width="2"/>
    <path d="M -40,-10 Q 0,-50 40,-10 Q 0,-30 -40,-10 Z" fill="#FFB74D" opacity="0.9"/>
